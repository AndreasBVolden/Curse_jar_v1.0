<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bannekrukke Ultra</title>
    <style>
        :root { --primary: #ffd700; --bg: #1a1a1a; --card: #2a2a2a; --text: #ffffff; --accent: #ff4757; --success: #2ed573; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        h1 { text-align: center; color: var(--primary); font-size: 26px; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        h3 { margin-bottom: 12px; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 5px; color: var(--primary); text-align: left; }
        .jar-container { position: relative; width: 140px; height: 160px; margin: 15px auto; border: 5px solid #fff; border-radius: 20px 20px 40px 40px; overflow: hidden; background: rgba(255,255,255,0.05); }
        .jar-lid { width: 80px; height: 12px; background: #fff; margin: 0 auto -5px auto; border-radius: 5px; }
        .jar-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #b8860b, var(--primary)); height: 0%; transition: height 0.3s; }
        .total-amount { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold; color: #fff; text-shadow: 1px 1px 5px rgba(0,0,0,0.9); z-index: 10; }
        input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; font-size: 16px; background: #333; color: #fff; }
        button { font-weight: bold; cursor: pointer; }
        .btn-add { background: var(--accent); color: #fff; }
        .btn-email { background: var(--success); color: #fff; }
        .btn-sync { background: #2196F3; color: #fff; }
        .stats-row { margin-bottom: 8px; font-size: 14px; text-align: left; }
        .stats-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .bar-container { background: #333; width: 100%; height: 12px; border-radius: 6px; overflow: hidden; }
        .bar-fill { background: var(--primary); height: 100%; width: 0%; }
        .log-list { text-align: left; list-style: none; font-size: 14px; }
        .log-list li { padding: 6px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤬 Bannekrukke Ultra</h1>
    
    <div class="card">
        <div class="jar-lid"></div>
        <div class="jar-container">
            <div class="total-amount" id="totalDisplay">0 kr</div>
            <div class="jar-fill" id="jarFill"></div>
        </div>
        
        <select id="nameSelect">
            <option value="Andreas">Andreas</option>
            <option value="Mathilde">Mathilde</option>
            <option value="Iben">Iben</option>
            <option value="Klara">Klara</option>
        </select>
        <input type="text" id="wordInput" placeholder="Hvilket ord glapp ut?">
        <button class="btn-add" onclick="leggTilBot()">Sleng i 50 kr! 💸</button>
    </div>

    <div class="card">
        <h3>📊 Oversikt over bøter</h3>
        <div id="statsContainer"></div>
    </div>

    <div class="card">
        <h3>📩 Synkronisering & E-post</h3>
        <button class="btn-sync" onclick="importerData()">Importer data fra gjengen 📥</button>
        <button class="btn-email" onclick="sendEpostRapport()">Send årsrapport til e-post 📧</button>
        <p style="font-size: 11px; color: #aaa; margin-top: 5px;">Rapporter sendes til: andreasbvolden@gmail.com</p>
    </div>

    <div class="card">
        <h3>📜 Siste hendelser</h3>
        <ul class="log-list" id="logList">
            <li>Krukken er tom.</li>
        </ul>
    </div>
</div>

<script>
    // Enkel og feilsikker datastruktur
    var data = { Andreas: 0, Mathilde: 0, Iben: 0, Klara: 0, logg: [] };

    // Hent lagrede data med en gang siden laste-lyttere kan svikte
    try {
        var lagret = localStorage.getItem('bannekrukke_lokal_data');
        if (lagret) {
            data = JSON.parse(lagret);
        }
    } catch(e) {}

    function oppdaterSkjerm() {
        var totalt = data.Andreas + data.Mathilde + data.Iben + data.Klara;
        document.getElementById('totalDisplay').innerText = totalt + " kr";
        
        // Oppdater visuell krukke
        var prosent = Math.min((totalt / 2000) * 100, 100);
        document.getElementById('jarFill').style.height = prosent + "%";

        // Oppdater statistikk-barer
        var maksBelop = Math.max(data.Andreas, data.Mathilde, data.Iben, data.Klara, 1);
        var navnListe = ["Andreas", "Mathilde", "Iben", "Klara"];
        var statsHtml = "";
        
        navnListe.forEach(function(navn) {
            var p = (data[navn] / maksBelop) * 100;
            statsHtml += '<div class="stats-row">' +
                '<div class="stats-label"><span>👤 ' + navn + '</span><strong>' + data[navn] + ' kr</strong></div>' +
                '<div class="bar-container"><div class="bar-fill" style="width: ' + p + '%"></div></div>' +
                '</div>';
        });
        document.getElementById('statsContainer').innerHTML = statsHtml;

        // Oppdater loggliste (viser de siste 5 hendelsene)
        var loggHtml = "";
        if (data.logg.length === 0) {
            loggHtml = "<li>Ingen registrerte synder.</li>";
        } else {
            var visningsLogg = data.logg.slice(-5).reverse();
            visningsLogg.forEach(function(innslag) {
                loggHtml += "<li><span><strong>" + innslag.navn + "</strong>: " + innslag.ord + "</span><strong>50 kr</strong></li>";
            });
        }
        document.getElementById('logList').innerHTML = loggHtml;
    }

    function leggTilBot() {
        var valgtNavn = document.getElementById('nameSelect').value;
        var ordet = document.getElementById('wordInput').value.trim() || "Banning";
        
        data[valgtNavn] += 50;
        data.logg.push({ navn: valgtNavn, ord: ordet });
        
        try {
            localStorage.setItem('bannekrukke_lokal_data', JSON.stringify(data));
        } catch(e) {}

        document.getElementById('wordInput').value = "";
        oppdaterSkjerm();
    }

    function sendEpostRapport() {
        var totalt = data.Andreas + data.Mathilde + data.Iben + data.Klara;
        var emne = encodeURIComponent("Bannekrukke - Statusrapport");
        var tekst = "Her er status for bannekrukken:\n\n" +
                    "TOTALT INNSAMLING: " + totalt + " kr\n" +
                    "-----------------------------------------\n" +
                    "👤 Andreas: " + data.Andreas + " kr\n" +
                    "👤 Mathilde: " + data.Mathilde + " kr\n" +
                    "👤 Iben: " + data.Iben + " kr\n" +
                    "👤 Klara: " + data.Klara + " kr\n" +
                    "-----------------------------------------\n" +
                    "Generert av Bannekrukke-appen.";
        
        window.location.href = "mailto:andreasbvolden@://gmail.com" + emne + "&body=" + encodeURIComponent(tekst);
    }

    function importerData() {
        var tekstInndata = prompt("Lim inn data-teksten du fikk fra et annet familiemedlem her:");
        if (!tekstInndata) return;
        try {
            var importert = JSON.parse(tekstInndata);
            if (importert && importert.Andreas !== undefined) {
                // Slå sammen verdiene (velger det høyeste beløpet eller summerer basert på behov, her overskriver vi med nyeste felles status)
                data.Andreas = Math.max(data.Andreas, importert.Andreas);
                data.Mathilde = Math.max(data.Mathilde, importert.Mathilde);
                data.Iben = Math.max(data.Iben, importert.Iben);
                data.Klara = Math.max(data.Klara, importert.Klara);
                
                // Slå sammen logg og fjern duplikater
                var flettaLogg = data.logg.concat(importert.logg);
                var unike = [];
                var sjekk = {};
                flettaLogg.forEach(function(item) {
                    var nokkel = item.navn + item.ord;
                    if (!sjekk[nokkel]) {
                        sjekk[nokkel] = true;
                        unike.push(item);
                    }
                });
                data.logg = unike;

                localStorage.setItem('bannekrukke_lokal_data', JSON.stringify(data));
                oppdaterSkjerm();
                alert("Krukken ble oppdatert med suksess!");
            }
        } catch(err) {
            alert("Kunne ikke lese dataene. Pass på at du kopierte nøyaktig det som sto.");
        }
    }

    // Kjør skjermoppdatering med en gang siden dataene ligger klare
    oppdaterSkjerm();
</script>

</body>
</html>
