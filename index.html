<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bannekrukke Ultra</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bannekrukke">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='100' fill='%231a1a1a'/><circle cx='256' cy='280' r='140' fill='none' stroke='%23ffd700' stroke-width='24'/><path d='M190 140 h132 v30 h-132 z' fill='%23ffd700'/><text x='256' y='320' font-size='110' text-anchor='middle'>🤬</text></svg>">

    <style>
        :root {
            --primary: #ffd700;
            --bg: #1a1a1a;
            --card: #2a2a2a;
            --text: #ffffff;
            --accent: #ff4757;
            --success: #2ed573;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 20px; margin-top: env(safe-area-inset-top); }
        h1 { text-align: center; color: var(--primary); font-size: 26px; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h3 { margin-bottom: 12px; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 5px; color: var(--primary); }
        
        .jar-container { position: relative; width: 140px; height: 160px; margin: 15px auto; border: 5px solid #fff; border-radius: 20px 20px 40px 40px; overflow: hidden; background: rgba(255,255,255,0.05); }
        .jar-lid { width: 80px; height: 12px; background: #fff; margin: 0 auto -5px auto; border-radius: 5px; }
        .jar-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #b8860b, var(--primary)); transition: height 0.5s ease; height: 0%; }
        .total-amount { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold; color: #fff; text-shadow: 1px 1px 5px rgba(0,0,0,0.9); z-index: 10; }
        
        input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; font-size: 16px; background: #333; color: #fff; }
        button { font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.97); }
        .btn-add { background: var(--accent); color: #fff; margin-top: 5px; }
        .btn-share { background: #4a4a4a; color: #fff; }
        .btn-email { background: var(--success); color: #fff; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #222; padding: 4px; border-radius: 8px; }
        .tab { flex: 1; padding: 8px 4px; font-size: 11px; background: none; color: #aaa; margin: 0; border-radius: 6px; }
        .tab.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .log-list { text-align: left; max-height: 140px; overflow-y: auto; list-style: none; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .log-list li { padding: 8px; border-bottom: 1px solid #333; font-size: 14px; display: flex; justify-content: space-between; }
        .share-zone { font-size: 12px; color: #aaa; word-break: break-all; margin-top: 5px; text-align: center; }

        .stats-row { margin-bottom: 12px; font-size: 14px; }
        .stats-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .favorite-word { font-size: 11px; color: #aaa; margin-bottom: 6px; display: block; padding-left: 20px; font-style: italic; }
        .bar-container { background: #333; width: 100%; height: 14px; border-radius: 7px; overflow: hidden; }
        .bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.6s ease; }
        
        .history-block { background: rgba(0,0,0,0.15); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .history-title { font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 5px; border-bottom: 1px dashed #444; }
        .history-item { font-size: 12px; display: flex; justify-content: space-between; padding: 2px 0; color: #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤬 Bannekrukke Ultra</h1>
    
    <div class="card" style="text-align: center;">
        <div class="jar-lid"></div>
        <div class="jar-container">
            <div class="total-amount" id="totalDisplay">0 kr</div>
            <div class="jar-fill" id="jarFill"></div>
        </div>
        
        <select id="nameSelect">
            <option value="Andreas">Andreas</option>
            <option value="Mathilde">Mathilde</option>
            <option value="Iben">Iben</option>
            <option value="Klara">Klara</option>
        </select>
        <input type="text" id="wordInput" placeholder="Hvilket ord glapp ut?">
        <button class="btn-add" id="addBtn">Sleng i 50 kr! 💸</button>
    </div>

    <div class="card">
        <h3>Statistikk & Analyse</h3>
        
        <div class="tabs">
            <button class="tab active" data-target="tab-month">Denne måned</button>
            <button class="tab" data-target="tab-names">Per person</button>
            <button class="tab" data-target="tab-history">Historikk</button>
            <button class="tab" data-target="tab-year">Årsrapport</button>
        </div>

        <div id="tab-month" class="tab-content active">
            <div id="monthStatsContainer"></div>
        </div>

        <div id="tab-names" class="tab-content">
            <div id="nameStatsContainer"></div>
        </div>

        <div id="tab-history" class="tab-content">
            <div id="historyStatsContainer" style="max-height: 250px; overflow-y: auto;"></div>
        </div>

        <div id="tab-year" class="tab-content" style="text-align: center;">
            <div id="yearStatsContainer" style="text-align: left; margin-bottom: 15px;"></div>
            <button class="btn-email" id="emailBtn">Send årsresultat til e-post 📧</button>
        </div>
    </div>

    <div class="card">
        <h3>Deling & Status</h3>
        <button class="btn-share" id="shareBtn">Del denne app-lenke med gjengen</button>
        <div class="share-zone" id="shareStatus">Starter applikasjonen...</div>
    </div>

    <div class="card">
        <h3>Siste 5 hendelser (Gjeldende år)</h3>
        <ul class="log-list" id="logList"></ul>
    </div>
</div>

<script>
try {
    // Globale variabler
    let jarId = "krukke_felles_gjeng";
    let localData = { logs: [] };
    const kvdbUrl = "https://kvdb.io"; 
    const PENALTY = 50;
    const TARGET_EMAIL = "andreasbvolden@gmail.com";
    const FIXED_NAMES = ["Andreas", "Mathilde", "Iben", "Klara"];

    // Hent lokale data trygt
    try {
        let saved = localStorage.getItem('bannekrukke_data');
        if (saved) localData = JSON.parse(saved);
    } catch(e) { console.error(e); }
    
    if (!localData || !localData.logs) localData = { logs: [] };

    // Bestem felles Krukke-ID
    if (window.location.search) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('jar')) jarId = urlParams.get('jar');
    } else if (window.location.hostname && window.location.hostname !== "localhost") {
        jarId = "krukke_" + window.location.hostname.replace(/[^a-zA-Z0-9]/g, "");
    }

    // Kjør oppsettet med en gang (siden HTML-elementene over allerede er ferdig lastet)
    document.getElementById('addBtn').onclick = registerCurse;
    document.getElementById('shareBtn').onclick = shareJar;
    document.getElementById('emailBtn').onclick = sendYearlyReport;
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = function() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            document.getElementById(this.getAttribute('data-target')).classList.add('active');
        };
    });

    document.getElementById('shareStatus').innerText = "Modus: Aktiv krukke (" + jarId + ")";
    updateUI();
    
    // Start sky-synk
    fetchData();
    setInterval(fetchData, 5000);

    function getFavoriteWord(userLogs, username) {
        let filtered = userLogs.filter(l => l.user === username && l.text && l.text.toLowerCase() !== "banning");
        if(filtered.length === 0) return "Ingen ord registrert";
        let counts = {};
        filtered.forEach(l => { let w = l.text.trim(); counts[w] = (counts[w] || 0) + 1; });
        let topWord = Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b);
        return topWord + ` (${counts[topWord]} stk)`;
    }

    function updateUI() {
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth();

        const currentYearLogs = localData.logs.filter(log => new Date(log.time).getFullYear() === currentYear);
        let yearlyTotal = currentYearLogs.reduce((sum, log) => sum + log.amount, 0);
        document.getElementById('totalDisplay').innerText = yearlyTotal + " kr";
        
        let fillPercent = Math.min((yearlyTotal / 2000) * 100, 100);
